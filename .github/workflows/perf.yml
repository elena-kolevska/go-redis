name: perf scenarios

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline-ref:
        description: Tag or SHA to compare against
        default: v9.23.0

jobs:
  perf:
    permissions:
      contents: read
      pull-requests: write
    uses: elena-kolevska/cae-perf-framework/.github/workflows/reusable-bench.yml@main
    with:
      bench-version: main
      target: perf/app
      config: perf/bench.yaml
      rounds: 5
      redis-version: "8.10.0"
      run-type: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
      baseline-ref: ${{ inputs.baseline-ref }}
      required: false
